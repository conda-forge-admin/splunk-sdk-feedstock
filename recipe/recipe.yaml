# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.2"
  # Pinned rather than inherited: this is a frozen old release, so it must not
  # follow conda-forge's minimum past the python 3.12 ceiling noted below.
  python_min: "3.10"

package:
  name: splunk-sdk
  version: ${{ version }}

source:
  # The PyPI sdist for this release ships no license file, so build from the
  # upstream tag archive instead; its splunklib/ and setup.py are identical.
  url: https://github.com/splunk/splunk-sdk-python/archive/refs/tags/${{ version }}.tar.gz
  sha256: 14f9dfebf0688784baf172caba8358554c5b2e8ba494c044bb0744e94cdd6437

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    # splunklib vendors six 1.14, whose meta path importer only implements the
    # find_module/load_module API that python 3.12 removed, so importing
    # splunklib.six.moves (and therefore splunklib itself) fails on >=3.12.
    - python >=${{ python_min }},<3.12

tests:
  - python:
      imports:
        - splunklib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/splunk-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: Splunk Software Development Kit for Python
  repository: https://github.com/splunk/splunk-sdk-python
  documentation: https://docs.splunk.com/Documentation/PythonSDK
  description: |
    The Splunk Software Development Kit for Python contains library code to
    enable developers to build applications that interact with Splunk, and
    modules that support the Splunk Custom Search Command protocol.

extra:
  recipe-maintainers:
    - pb01ka
