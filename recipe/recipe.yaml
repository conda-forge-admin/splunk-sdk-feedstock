# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.2"
  # Pinned rather than inherited: this is a frozen old release, so it must not
  # follow conda-forge's minimum past the python 3.12 ceiling noted below.
  python_min: "3.10"

package:
  name: splunk-sdk
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/s/splunk-sdk/splunk-sdk-${{ version }}.tar.gz
    sha256: 36d27f83e7cc8309be6e3b92e46c547caea566b0c006238025073843e586e5a8
  # The sdist ships no license file, so take it from the matching upstream tag.
  - url: https://raw.githubusercontent.com/splunk/splunk-sdk-python/${{ version }}/LICENSE
    sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    # splunklib vendors six 1.14, whose meta path importer only implements the
    # find_module/load_module API that python 3.12 removed, so importing
    # splunklib.six.moves (and therefore splunklib itself) fails on >=3.12.
    - python >=${{ python_min }},<3.12

tests:
  - python:
      imports:
        - splunklib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/splunk-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: Splunk Software Development Kit for Python
  repository: https://github.com/splunk/splunk-sdk-python
  documentation: https://docs.splunk.com/Documentation/PythonSDK
  description: |
    The Splunk Software Development Kit for Python contains library code to
    enable developers to build applications that interact with Splunk, and
    modules that support the Splunk Custom Search Command protocol.

extra:
  recipe-maintainers:
    - pb01ka
